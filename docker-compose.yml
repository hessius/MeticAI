# ==============================================================================
# Metic Docker Compose Configuration
# ==============================================================================
# Single unified container running the Bun server (web UI + API + telemetry).
#
# Usage:
#   docker compose up -d
#
# Optional add-ons:
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.watchtower.yml up -d
# ==============================================================================

services:
  meticai:
    image: ghcr.io/hessius/meticai:${METICAI_TAG:-latest}
    container_name: meticai
    restart: unless-stopped
    ports:
      - "3550:3550"   # Web UI + API
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - METICULOUS_IP=${METICULOUS_IP:-}
      - DATA_DIR=/data
      # Storage backend for /data: "json" (flat files, default) or "sqlite".
      - STORAGE_BACKEND=${STORAGE_BACKEND:-json}
    volumes:
      - meticai-data:/data
    healthcheck:
      # The distroless image has no shell/curl; the binary self-probes /health.
      test: ["CMD", "/app/metic", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  meticai-data:
    name: meticai-data
