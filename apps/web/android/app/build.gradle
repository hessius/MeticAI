apply plugin: 'com.android.application'

// Derive versionName/versionCode from the repo-root VERSION file so APK metadata
// tracks releases and Android's monotonic-versionCode upgrade rule is satisfied.
// Scheme: major*10_000_000 + minor*100_000 + patch*1_000 + stageCode, where
// stageCode orders prereleases below the final release of the same patch:
// alpha.N → 100+N, beta.N → 200+N, rc.N → 300+N, final → 999.
ext.meticVersion = {
    def versionFile = new File(rootProject.projectDir, "../../../VERSION")
    def name = versionFile.exists() ? versionFile.text.trim() : "0.0.0"
    def matcher = (name =~ /^(\d+)\.(\d+)\.(\d+)(?:-(alpha|beta|rc)\.(\d+))?/)
    if (!matcher.find()) {
        return [name: name, code: 1]
    }
    def major = matcher.group(1).toInteger()
    def minor = matcher.group(2).toInteger()
    def patch = matcher.group(3).toInteger()
    def stage = matcher.group(4)
    def pre = matcher.group(5) ? matcher.group(5).toInteger() : 0
    def stageCode
    if (stage == null) stageCode = 999
    else if (stage == 'alpha') stageCode = 100 + pre
    else if (stage == 'beta') stageCode = 200 + pre
    else if (stage == 'rc') stageCode = 300 + pre
    else stageCode = 0
    def code = major * 10_000_000 + minor * 100_000 + patch * 1_000 + stageCode
    return [name: name, code: code]
}()

android {
    namespace = "com.metic.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.metic.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode meticVersion.code
        versionName meticVersion.name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing is configured only when a keystore is available (CI via
    // env vars, or a local keystore.properties). Without it, `assembleRelease`
    // still produces an unsigned APK so local/PR builds don't require secrets.
    def keystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
    def keystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def keystoreAlias = System.getenv("ANDROID_KEY_ALIAS")
    def keystoreKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
    def keystorePropsFile = rootProject.file("keystore.properties")
    if ((keystorePath == null || keystorePath.isEmpty()) && keystorePropsFile.exists()) {
        def props = new Properties()
        keystorePropsFile.withInputStream { props.load(it) }
        keystorePath = props.getProperty("storeFile")
        keystorePassword = props.getProperty("storePassword")
        keystoreAlias = props.getProperty("keyAlias")
        keystoreKeyPassword = props.getProperty("keyPassword")
    }
    def hasReleaseSigning = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
