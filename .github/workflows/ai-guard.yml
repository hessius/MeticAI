# ==============================================================================
# AI Guard — guardrails for AI-generated code
# ==============================================================================
# Runs eslint-plugin-ai-guard (https://github.com/YashJadhav21/eslint-plugin-ai-guard)
# over the pull-request diff and uploads findings to GitHub Code Scanning so they
# surface as inline PR annotations and Security → Code scanning alerts.
#
# Intentionally NON-BLOCKING (`--fail-on none` + continue-on-error): findings are
# advisory and triaged by a human (fix or dismiss), exactly like CodeQL alerts.
# This keeps the pipeline green while still catching new high-severity patterns.
#
# A reviewed baseline of false positives (async test callbacks, localStorage key
# names, first-party JSON.parse in the direct-mode interceptor, etc.) is stripped
# from the SARIF before upload via .github/scripts/ai-guard-sarif-filter.mjs,
# driven by the allowlist in .github/ai-guard-ignore.json. Add new suppressions
# there (with a justification) rather than dismissing alerts one by one.
#
# Note: the JS project lives in apps/web (no root package.json). ai-guard's
# `changed` mode resolves git-diff paths relative to the repo root, so the CLI is
# run from the repo root with NODE_PATH pointing at apps/web/node_modules. This
# yields repo-root-relative SARIF paths (apps/web/src/...) that Code Scanning can
# map back to the source.
# ==============================================================================

name: AI Guard

on:
  pull_request:
    branches: [main, develop, "version/*"]
    paths:
      - "apps/web/**"

permissions:
  contents: read
  security-events: write

jobs:
  ai-guard:
    name: AI Guard (changed files)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history so `ai-guard changed --pr` can diff against the base branch.
          fetch-depth: 0

      - name: Setup Bun (attempt 1)
        id: setup_bun_1
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Bun (attempt 2)
        id: setup_bun_2
        if: steps.setup_bun_1.outcome == 'failure'
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Bun (attempt 3)
        if: steps.setup_bun_2.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Scan changed files
        continue-on-error: true
        env:
          NODE_PATH: ${{ github.workspace }}/apps/web/node_modules
        run: |
          ./apps/web/node_modules/.bin/ai-guard changed \
            --pr \
            --sarif \
            --sarif-output ai-guard-results.sarif \
            --github-summary \
            --fail-on none

      - name: Suppress reviewed false-positive baseline
        if: always() && hashFiles('ai-guard-results.sarif') != ''
        run: node .github/scripts/ai-guard-sarif-filter.mjs ai-guard-results.sarif

      - name: Upload to GitHub Code Scanning
        if: always() && hashFiles('ai-guard-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ai-guard-results.sarif
          category: ai-guard
